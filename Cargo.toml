[package]
edition = "2024"
name = "loongarch_vcpu"
version = "0.1.0"
authors = [
    "ZuJun Xie <zujunxie1@gmail.com>",
]
description = "loongarch VCPU implementation for Arceos Hypervisor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/numpy1314/loongarch_vcpu"
categories = ["embedded", "no-std"]
keywords = ["hypervisor", "loongarch", "vcpu"]


[dependencies]
log = "0.4"
spin = "0.10"

numeric-enum-macro = "0.2"
tock-registers = "0.9"

axerrno = "0.2"
percpu = "0.2.3-preview.1"

axaddrspace = "0.3"
axdevice_base = "0.2.2"
axvcpu = "0.3"
axvisor_api = "0.3"
